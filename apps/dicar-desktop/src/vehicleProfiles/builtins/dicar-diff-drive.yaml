schema_version: 1
vehicle:
  id: dicar-diff-drive
  display_name: DiCar 差速车
  type: 双轮差速
  order: 10
control_loops:
  - id: speed
    label: 速度环
    category: 驱动控制
    hint: 先小步调整 Kp，观察目标、实际、误差与左右 PWM；确认稳定后再固化。
    target_parameter: control.target_speed_mps
    gains:
      Kp: pid.kp
      Ki: pid.speed.ki
      Kd: pid.speed.kd
    telemetry:
      target: drive.target_speed_mps
      feedback: drive.speed_mps
      error: drive.speed_error_mps
      outputs:
        - motor.left_pwm
        - motor.right_pwm
    recommended_channels:
      - drive.target_speed_mps
      - drive.speed_mps
      - drive.speed_error_mps
      - motor.left_pwm
      - motor.right_pwm
parameter_sections:
  - id: encoder
    label: 编码器标定
    parameters:
      - encoder.left.ppr
      - encoder.right.ppr
      - encoder.quadrature_multiplier
      - encoder.left.inverted
      - encoder.right.inverted
      - encoder.sample_period_us
      - encoder.speed_lpf_hz
      - encoder.jump_threshold_counts
      - encoder.max_credible_rpm
      - encoder.missing_pulse_detection
  - id: drive
    label: 底盘几何
    parameters:
      - drive.wheel_diameter_mm
      - drive.gear_ratio
scope_presets:
  - id: speed-loop
    label: 速度环总览
    channels:
      - drive.target_speed_mps
      - drive.speed_mps
      - drive.speed_error_mps
      - motor.left_pwm
      - motor.right_pwm
  - id: wheel-speed
    label: 左右轮速
    channels:
      - drive.speed_mps
      - drive.left_wheel_speed_mps
      - drive.right_wheel_speed_mps
